<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalir - September 2026 Issue - Vaalu Pathippagam</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <style>
        body {
            background-color: #F4F1EA; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        /* புத்தகத்தின் கன்டெய்னர் - நடுவில் கச்சிதமாக நிற்க */
        #book-wrapper {
            width: 100vw;
            height: calc(100vh - 100px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            transition: transform 0.3s ease;
        }
        
        #book {
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .page {
            background-color: #fff;
            border: solid 1px #e3e3e3;
            overflow: hidden;
            position: relative;
        }
        
        .page .bg-img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
            pointer-events: none;
        }

        .controls {
            height: 50px;
            background: #333;
            padding: 5px 20px;
            border-radius: 30px;
            color: white;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
            margin-bottom: 20px;
        }
        .controls button {
            background: #FFD700; border: none; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-weight: bold; color: black;
        }
        .controls input {
            width: 50px; text-align: center; border-radius: 5px; border: none; padding: 3px;
        }
    </style>
</head>
<body oncontextmenu="return false;">  
    
    <audio id="flipSound" src="flip.mp3"></audio>
    
    <div id="book-wrapper">
        <div class="flip-book" id="book">
            <div class="page"><img src="page_1.jpg" class="bg-img" alt="பக்கம் 1"></div>
            <div class="page"><img src="page_2.jpg" class="bg-img" alt="பக்கம் 2"></div>
            <div class="page"><img src="page_3.jpg" class="bg-img" alt="பக்கம் 3"></div>
            <div class="page"><img src="page_4.jpg" class="bg-img" alt="பக்கம் 4"></div>
            <div class="page"><img src="page_5.jpg" class="bg-img" alt="பக்கம் 5"></div>
            <div class="page"><img src="page_6.jpg" class="bg-img" alt="பக்கம் 6"></div>
            <div class="page"><img src="page_7.jpg" class="bg-img" alt="பக்கம் 7"></div>
            <div class="page"><img src="page_8.jpg" class="bg-img" alt="பக்கம் 8"></div>
            <div class="page"><img src="page_9.jpg" class="bg-img" alt="பக்கம் 9"></div>
            <div class="page"><img src="page_10.jpg" class="bg-img" alt="பக்கம் 10"></div>
            <div class="page"><img src="page_11.jpg" class="bg-img" alt="பக்கம் 11"></div>
            <div class="page"><img src="page_12.jpg" class="bg-img" alt="பக்கம் 12"></div>
            <div class="page"><img src="page_13.jpg" class="bg-img" alt="பக்கம் 13"></div>
            <div class="page"><img src="page_14.jpg" class="bg-img" alt="பக்கம் 14"></div>
            <div class="page"><ins class="bg-img" src="page_15.jpg"></ins><img src="page_15.jpg" class="bg-img" alt="பக்கம் 15"></div>
            <div class="page"><img src="page_16.jpg" class="bg-img" alt="பக்கம் 16"></div>
            <div class="page"><img src="page_17.jpg" class="bg-img" alt="பக்கம் 17"></div>
            <div class="page"><img src="page_18.jpg" class="bg-img" alt="பக்கம் 18"></div>
            <div class="page"><img src="page_19.jpg" class="bg-img" alt="பக்கம் 19"></div>
            <div class="page"><img src="page_20.jpg" class="bg-img" alt="பக்கம் 20"></div>
            <div class="page"><img src="page_21.jpg" class="bg-img" alt="பக்கம் 21"></div>
            <div class="page"><img src="page_22.jpg" class="bg-img" alt="பக்கம் 22"></div>
            <div class="page"><img src="page_23.jpg" class="bg-img" alt="பக்கம் 23"></div>
            <div class="page"><img src="page_24.jpg" class="bg-img" alt="பக்கம் 24"></div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button id="btn-zoom-out">- ஜூம் குறை</button>
        <button id="btn-zoom-in">+ ஜூம் ஏற்று</button>
        <span>பக்கம்: <span id="current-page">1</span> / <span id="total-pages">24</span></span>
        <input type="number" id="goto-input" min="1" max="24">
        <button id="btn-goto">செல்</button>
    </div>

    <script>
        window.onload = function() {
            try {
                if (typeof St !== 'undefined') {
                    const pageFlip = new St.PageFlip(document.getElementById('book'), {
                        width: 400,
                        height: 560,
                        size: 'fixed',
                        showCover: true, 
                        usePortrait: true,
                        drawShadow: true,
                        maxShadowOpacity: 0.4,
                        mobileScrollSupport: true
                    });
                    
                    const pages = document.querySelectorAll('.page');
                    pageFlip.loadFromHTML(pages);

                    const flipSound = document.getElementById('flipSound');
                    
                    pageFlip.on('changeState', (e) => {
                        if (e.data === 'flipping') {
                            if (flipSound && flipSound.readyState >= 2) {
                                flipSound.currentTime = 0;
                                let playPromise = flipSound.play();
                                if (playPromise !== undefined) {
                                    playPromise.catch(error => { console.log("Audio prevented"); });
                                }
                            }
                        }
                    });

                    pageFlip.on('flip', (e) => {
                        document.getElementById('current-page').innerText = e.data + 1;
                    });

                    let currentZoom = 1;
                    const wrapper = document.getElementById('book-wrapper');
                    
                    document.getElementById('btn-zoom-in').addEventListener('click', () => {
                        if(currentZoom < 2.5) { currentZoom += 0.2; wrapper.style.transform = `scale(${currentZoom})`; }
                    });
                    
                    document.getElementById('btn-zoom-out').addEventListener('click', () => {
                        if(currentZoom > 0.5) { currentZoom -= 0.2; wrapper.style.transform = `scale(${currentZoom})`; }
                    });

                    document.getElementById('btn-goto').addEventListener('click', () => {
                        let target = parseInt(document.getElementById('goto-input').value);
                        if(target >= 1 && target <= 24) {
                            pageFlip.flip(target - 1);
                        }
                    });
                } else {
                    console.warn("ப்ளிப் புக் அனிமேஷன் வேலை செய்ய இன்டர்நெட் தேவை!");
                }
            } catch(err) {
                console.error("புத்தகம் லோட் ஆவதில் பிழை: ", err);
            }
        };
    </script>
</body>
</html>
